<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05386b" />
    <!-- Launched from the home screen, open full screen with no browser bars. iOS
         reads these; Android reads display: standalone from the manifest. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SRB Partners" />
    <!-- Content runs under the status bar, which shows over the navy header;
         the header pads itself by the safe-area inset. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Sri Raja Bags Partners</title>
    <!-- Google tag: the same property as www.srirajabags.in, so one visitor moving
         between the two is one user. Events carry no personal data (see
         src/domain/analytics.js). -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PEF5RMYG3G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PEF5RMYG3G');
    </script>
    <meta name="description" content="Custom-printed non-woven bags made in our factory. Send us an enquiry." />
    <!-- Link previews are written for the buyer: a referral link shared on
         WhatsApp is the first thing a prospective customer sees of us. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sri Raja Bags" />
    <meta property="og:title" content="Custom-printed non-woven bags — Sri Raja Bags" />
    <meta property="og:description" content="Bulk non-woven bags printed with your shop name and logo, made in our own factory. Send an enquiry and we'll call you back." />
    <!-- 1200x630 and under 300 KB: what WhatsApp needs to draw the large card. -->
    <meta property="og:image" content="https://refer.srirajabags.in/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bag-making machines on the Sri Raja Bags factory floor" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
